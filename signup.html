<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signup • DreamSync</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="auth.css">
</head>
<body class="auth-body">
  <div class="auth-container">
    <h1 class="auth-title">DreamSync</h1>
    <h2 class="auth-subtitle">Create your account</h2>
    <form id="signupForm" class="auth-form">
      <input type="text" id="signupName" placeholder="Full Name" required>
      <input type="email" id="signupEmail" placeholder="Email" required>
      <input type="password" id="signupPassword" placeholder="Password" required>
      <div class="password-strength" id="passwordStrength"></div>
      <small id="passwordStrengthText">Password strength</small>
      <button type="submit" class="btn btn-primary"><span id="signupSpinner" class="spinner" style="display:none;"></span>Sign Up</button>
    </form>
    <div class="auth-divider">
      <span>Or continue with</span>
    </div>
    <div class="social-login">
      <button class="btn btn-secondary" onclick="socialLogin('google')"><i class="fab fa-google"></i> Google</button>
      <button class="btn btn-secondary" onclick="socialLogin('apple')"><i class="fab fa-apple"></i> Apple</button>
    </div>
    <p class="auth-switch">Already have an account? <a href="index.html">Login</a></p>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
  <script src="auth.js"></script>
</body>
</html>
