<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login • DreamSync</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="auth.css">
</head>
<body class="auth-body">
  <div class="auth-container">
    <h1 class="auth-title">DreamSync</h1>
    <h2 class="auth-subtitle">Login to your account</h2>
    <form id="loginForm" class="auth-form">
      <input type="email" id="loginEmail" placeholder="Email" required value="morenyou88@gmail.com">
      <input type="password" id="loginPassword" placeholder="Password" required value="password123">
      <div class="auth-options">
        <label>
          <input type="checkbox" id="rememberMe"> Remember me
        </label>
        <a href="#" id="forgotPassword">Forgot password?</a>
      </div>
      <button type="submit" class="btn btn-primary"><span id="loginSpinner" class="spinner" style="display:none;"></span>Login</button>
    </form>
    <div class="auth-divider">
      <span>Or continue with</span>
    </div>
    <div class="social-login">
      <button class="btn btn-secondary" onclick="socialLogin('google')"><i class="fab fa-google"></i> Google</button>
      <button class="btn btn-secondary" onclick="socialLogin('apple')"><i class="fab fa-apple"></i> Apple</button>
    </div>
    <p class="auth-switch">Don't have an account? <a href="signup.html">Sign up</a></p>
  </div>

  <!-- Forgot Password Modal -->
  <div class="page-overlay" id="forgotPassword-page">
    <div class="page-content">
      <!-- <div class="close-btn" onclick="hidePage('forgotPassword')"><i class="fas fa-times"></i></div> -->
      <!-- <h2 class="page-title"><i class="fas fa-key"></i> Reset Password</h2> -->
      <!-- <p>Enter your email address and we'll send you instructions to reset your password.</p> -->
      <form id="forgotPasswordForm">
        <!-- <div class="form-group"> -->
          <!-- <input type="email" id="resetEmail" placeholder="Email" required> -->
        </div>
        <!-- <button type="submit" class="btn btn-primary">Send Reset Instructions</button> -->
      </form>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
  <script src="auth.js"></script>
</body>
</html>
